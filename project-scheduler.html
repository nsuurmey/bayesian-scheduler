        const getDateFromWeek = (week) => {
            const date = new Date(YEAR_2026_START);
            date.setDate(date.getDate() + (week - 1) * 7);
            return date;
        };

        const formatDate = (date) => {
            const month = date.toLocaleDateString('en-US', { month: 'short' });

        const getMonthsFor2026 = () => {
            const months = [];
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                               'July', 'August', 'September', 'October', 'November', 'December'];

            // For each month, find which weeks contain days from that month
            for (let monthNum = 0; monthNum < 12; monthNum++) {
                const firstDayOfMonth = new Date(2026, monthNum, 1);
                const lastDayOfMonth = new Date(2026, monthNum + 1, 0);

                // Calculate week numbers for first and last day of month
                const firstWeek = Math.floor((firstDayOfMonth - YEAR_2026_START) / (1000 * 60 * 60 * 24 * 7)) + 1;
                const lastWeek = Math.floor((lastDayOfMonth - YEAR_2026_START) / (1000 * 60 * 60 * 24 * 7)) + 1;

                months.push({
                    name: monthNames[monthNum],
                    weekStart: Math.max(1, firstWeek),
                    weekEnd: Math.min(52, lastWeek)
                });
            }

            return months;
        };

        const getWeekFromDate = (dateStr) => {
            const date = new Date(dateStr);
            const daysDiff = Math.floor((date - YEAR_2026_START) / (1000 * 60 * 60 * 24));
            return Math.floor(daysDiff / 7) + 1;
        };

        // Bayesian Update Functions
        const LIKELIHOOD_RATIOS = {
            positive: {
                High: 2.0,
                Medium: 1.5,
                Low: 1.2
            },
            negative: {
                High: 0.5,
                Medium: 0.67,
                Low: 0.83
            }
        };

        const probabilityToOdds = (probability) => {
            const p = probability / 100;
            return p / (1 - p);
        };

        const oddsToProbability = (odds) => {
            const p = odds / (1 + odds);
            return Math.max(1, Math.min(99, p * 100)); // Bounded between 1% and 99%
        };

        const applyBayesianUpdate = (currentProbability, observationType, likelihood) => {
            const likelihoodRatio = LIKELIHOOD_RATIOS[observationType][likelihood];
            const currentOdds = probabilityToOdds(currentProbability);
            const newOdds = currentOdds * likelihoodRatio;
            const newProbability = oddsToProbability(newOdds);

            return {
                prior: currentProbability,
                likelihoodRatio,
                posterior: Math.round(newProbability),
                change: Math.round(newProbability - currentProbability)
            };
        };

                    p.startWeek <= week &&
                    p.startWeek + p.durationWeeks > week &&
                    (p.assignedPeople || []).some(a => a.personId === personId)

            let peak = 0;
            for (let w = project.startWeek; w < project.startWeek + project.durationWeeks; w++) {
                peak = Math.max(peak, getPersonWeekLoad(personId, w, projects));

            return peak;

            return projects.filter(p =>

        // Project Detail Modal Component
        const ProjectDetailModal = ({ projectId, onClose }) => {
            const { state, dispatch } = useContext(AppContext);

            const [formData, setFormData] = useState(project);
            const [showAllPositive, setShowAllPositive] = useState(false);
            const [showAllNegative, setShowAllNegative] = useState(false);

            const handleSave = () => {
                dispatch({
                    type: 'UPDATE_PROJECT',
                    payload: { id: projectId, updates: formData }
                });
                onClose();
            };

            const handleDelete = () => {
                if (confirm('Are you sure you want to delete this project?')) {
                    dispatch({ type: 'DELETE_PROJECT', payload: projectId });
                    onClose();
                }
            };

            const addObservation = (type) => {
                const text = prompt(`Add ${type} observation:`);
                if (text) {
                    const likelihood = prompt('Likelihood (Low/Medium/High):', 'Medium');
                    if (!likelihood || !['Low', 'Medium', 'High'].includes(likelihood)) {
                        alert('Please enter Low, Medium, or High');
                        return;
                    }

                    const newObs = {
                        text,
                        likelihood: likelihood || 'Medium',
                        timestamp: new Date().toISOString()
                    };

                    // Apply Bayesian update
                    const bayesianUpdate = applyBayesianUpdate(
                        formData.probability,
                        type,
                        likelihood
                    );

                    const confirmMessage = `Observation: "${text}"\nType: ${type.charAt(0).toUpperCase() + type.slice(1)} | Likelihood: ${likelihood}\n\nBayesian Update:\nCurrent: ${bayesianUpdate.prior}%\nLikelihood Ratio: ${bayesianUpdate.likelihoodRatio}x\nNew Probability: ${bayesianUpdate.posterior}% (${bayesianUpdate.change > 0 ? '+' : ''}${bayesianUpdate.change}%)\n\nApply this update?`;

                    if (confirm(confirmMessage)) {
                        const historyEntry = {
                            probability: bayesianUpdate.posterior,
                            reason: `${type.charAt(0).toUpperCase() + type.slice(1)} observation: "${text}" (${likelihood})`,
                            timestamp: new Date().toISOString(),
                            type: 'bayesian_update',
                            priorProbability: bayesianUpdate.prior,
                            likelihoodRatio: bayesianUpdate.likelihoodRatio
                        };

                        setFormData({
                            ...formData,
                            probability: bayesianUpdate.posterior,
                            observations: {
                                ...formData.observations,
                                [type]: [...(formData.observations?.[type] || []), newObs]
                            },
                            probabilityHistory: [
                                ...(formData.probabilityHistory || []),
                                historyEntry
                            ]
                        });
                    }
                }
            };

                setFormData({
                    ...formData,
                    observations: {
                        ...formData.observations,
                        [type]: formData.observations[type].filter((_, i) => i !== index)

                        {/* Assigned People section */}
                        {(() => {

                            const addPerson = (personId) => {
                                if (assignedIds.has(personId)) return;
                                setFormData({
                                    ...formData,
                                    assignedPeople: [...assigned, { personId, fraction: 1.0 }]
                                });
                            };

                            const updateFraction = (personId, fraction) => {
                                setFormData({
                                    ...formData,
                                    assignedPeople: assigned.map(a => a.personId === personId ? { ...a, fraction } : a)
                                });
                            };

                            const removePerson = (personId) => {
                                setFormData({
                                    ...formData,
                                    assignedPeople: assigned.filter(a => a.personId !== personId)
                                });
                            };

                            // Sorted picker list: matching roles first
                            const dsCount = formData.resources?.dataScientists || 0;
                            const gsCount = formData.resources?.geoscientists || 0;
                            const pmCount = formData.resources?.projectManagers || 0;
                            const neededRoles = [];
                            if (dsCount > 0) neededRoles.push('Data Scientist');
                            if (gsCount > 0) neededRoles.push('Geoscientist');
                            if (pmCount > 0) neededRoles.push('Project Manager');

                            const availablePeople = people
                                .filter(p => !assignedIds.has(p.id))
                                .sort((a, b) => {
                                    const aNeeded = neededRoles.includes(a.role) ? 0 : 1;
                                    const bNeeded = neededRoles.includes(b.role) ? 0 : 1;
                                    return aNeeded - bNeeded || a.name.localeCompare(b.name);

                            return (

                                            <div className="text-sm text-gray-400 mb-2">No one assigned yet.</div>
                                        )}
                                        {assigned.map(a => {
                                            const person = people.find(p => p.id === a.personId);
                                            const displayName = person ? person.name : <em className="text-gray-400">Unknown Person</em>;
                                            const displayRole = person ? person.role : '';
                                            const cap = person ? person.capacity : 1.0;

                                            // Over-allocation check
                                            let overWarn = null;
                                            if (person && formData.startWeek) {
                                                const otherProjects = state.projects.filter(p => p.id !== formData.id);
                                                const peakOther = getPersonPeakLoadDuringProject(person.id, formData, otherProjects);
                                                const totalPeak = peakOther + a.fraction;
                                                if (totalPeak > cap) {
                                                    const conflicts = getConflictingProjects(person.id, formData, state.projects);
                                                    overWarn = (
                                                        <span
                                                            className="ml-2 text-amber-600 text-xs cursor-help"
                                                            title={`Peak ${Math.round(totalPeak * 100)}% — also on: ${conflicts.map(c => c.name).join(', ')}`}
                                                        >
                                                            ⚠ {Math.round(totalPeak * 100)}%
                                                        </span>
                                                    );
                                                }
                                            }

                                            return (
                                                <div key={a.personId} className="flex items-center gap-3 mb-2 py-1 border-b border-gray-200 last:border-0">
                                                    <div className="flex-1 text-sm font-medium">{displayName}</div>
                                                    <div className="text-xs text-gray-500 w-28">{displayRole}</div>
                                                    <select
                                                        value={a.fraction}
                                                        onChange={e => updateFraction(a.personId, parseFloat(e.target.value))}
                                                        className="text-sm border border-gray-300 rounded px-2 py-1"
                                                    >
                                                        {FRACTION_OPTIONS.map(f => (
                                                            <option key={f} value={f}>{f.toFixed(2)}</option>
                                                        ))}
                                                    </select>
                                                    {overWarn}
                                                    <button
                                                        onClick={() => removePerson(a.personId)}
                                                        className="text-red-500 hover:text-red-700 text-sm"
                                                    >×</button>
                                                </div>

                                        })}

                                            <div className="flex items-center gap-2 mt-2">
                                                <span className="text-sm text-gray-500">+ Add:</span>
                                                <select
                                                    className="text-sm border border-gray-300 rounded px-2 py-1"
                                                    defaultValue=""
                                                    onChange={e => { if (e.target.value) { addPerson(e.target.value); e.target.value = ''; } }}
                                                >
                                                    <option value="" disabled>Select person…</option>
                                                    {availablePeople.map((p, i) => {
                                                        const isNeeded = neededRoles.includes(p.role);
                                                        const prevWasNeeded = i > 0 && neededRoles.includes(availablePeople[i - 1].role);
                                                        return (
                                                            <React.Fragment key={p.id}>
                                                                {i > 0 && isNeeded !== prevWasNeeded && (
                                                                    <option disabled>──────────────</option>
                                                                )}

                                                            </React.Fragment>
                                                        );
                                                    })}
                                                </select>
                                            </div>
                                        )}
                                        {people.length === 0 && (
                                            <div className="text-xs text-gray-400 mt-1">Add people in the People tab first.</div>

                                    </div>
                                </div>

                        })()}

                        <div className="mb-4">

        // Project List View Component
        const ProjectListView = () => {
            const { state, dispatch } = useContext(AppContext);
            const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });
            const [editingNameId, setEditingNameId] = useState(null);
            const [editingNameValue, setEditingNameValue] = useState('');
            const [nameError, setNameError] = useState('');

            const startNameEdit = (project) => {
                setEditingNameId(project.id);
                setEditingNameValue(project.name);
                setNameError('');
            };

            const cancelNameEdit = () => {
                setEditingNameId(null);
                setEditingNameValue('');
                setNameError('');
            };

            const saveNameEdit = () => {
                const trimmed = editingNameValue.trim();
                if (!trimmed) {
                    setNameError('Name cannot be empty');
                    return;
                }
                const duplicate = state.projects.some(p => p.id !== editingNameId && p.name.toLowerCase() === trimmed.toLowerCase());
                if (duplicate) {
                    setNameError('A project with this name already exists');
                    return;
                }
                dispatch({ type: 'UPDATE_PROJECT', payload: { id: editingNameId, updates: { name: trimmed } } });
                setEditingNameId(null);
                setEditingNameValue('');
                setNameError('');
            };

            const handleNameKeyDown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    saveNameEdit();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    cancelNameEdit();
                }
            };

            const filteredProjects = useMemo(() => {
                let filtered = [...state.projects];

                const { search, stages, okrs, sources, scheduled } = state.ui.filters;

                if (search) {
                    filtered = filtered.filter(p =>
                        p.name.toLowerCase().includes(search.toLowerCase()) ||
                        p.sponsor.toLowerCase().includes(search.toLowerCase())
                    );
                }

                if (stages.length > 0) {
                    filtered = filtered.filter(p => stages.includes(p.stage));
                }

                if (okrs.length > 0) {
                    filtered = filtered.filter(p => okrs.includes(p.okr));
                }

                if (sources.length > 0) {
                    filtered = filtered.filter(p => sources.includes(p.source));
                }

                if (scheduled === 'scheduled') {
                    filtered = filtered.filter(p => p.startWeek !== null);
                } else if (scheduled === 'unscheduled') {
                    filtered = filtered.filter(p => p.startWeek === null);
                }

                if (sortConfig.key) {
                    filtered.sort((a, b) => {
                        let aVal = a[sortConfig.key];
                        let bVal = b[sortConfig.key];

                        if (sortConfig.key === 'resources') {
                            aVal = a.resources.dataScientists + a.resources.geoscientists + a.resources.projectManagers;
                            bVal = b.resources.dataScientists + b.resources.geoscientists + b.resources.projectManagers;
                        }

                        if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }

                return filtered;
            }, [state.projects, state.ui.filters, sortConfig]);

            const handleSort = (key) => {
                setSortConfig({
                    key,
                    direction: sortConfig.key === key && sortConfig.direction === 'asc' ? 'desc' : 'asc'
                });
            };

            return (
                <div>
                    <div className="mb-4 flex gap-4">
                        <input
                            type="text"
                            placeholder="Search by name or sponsor..."
                            value={state.ui.filters.search}
                            onChange={(e) => dispatch({
                                type: 'SET_FILTERS',
                                payload: { search: e.target.value }
                            })}
                            className="flex-1 px-3 py-2 border border-gray-300 rounded-md"
                        />
                        <select
                            multiple
                            value={state.ui.filters.stages}
                            onChange={(e) => dispatch({
                                type: 'SET_FILTERS',
                                payload: { stages: Array.from(e.target.selectedOptions, option => option.value) }
                            })}
                            className="px-3 py-2 border border-gray-300 rounded-md"
                        >
                            <option>Signed</option>
                            <option>Close to Signing</option>
                            <option>Interested</option>
                            <option>Frontier</option>
                        </select>
                        <select
                            value={state.ui.filters.scheduled || ''}
                            onChange={(e) => dispatch({
                                type: 'SET_FILTERS',
                                payload: { scheduled: e.target.value || null }
                            })}
                            className="px-3 py-2 border border-gray-300 rounded-md"
                        >
                            <option value="">All</option>
                            <option value="scheduled">Scheduled</option>
                            <option value="unscheduled">Unscheduled</option>
                        </select>
                    </div>

                    <div className="table-container">
                        <table className="w-full border-collapse">
                            <thead className="sticky-header bg-gray-100">
                                <tr>
                                    <th className="px-4 py-2 text-left cursor-pointer" onClick={() => handleSort('name')}>
                                        Name {sortConfig.key === 'name' && (sortConfig.direction === 'asc' ? '↑' : '↓')}
                                    </th>
                                    <th className="px-4 py-2 text-left cursor-pointer" onClick={() => handleSort('sponsor')}>
                                        Sponsor {sortConfig.key === 'sponsor' && (sortConfig.direction === 'asc' ? '↑' : '↓')}
                                    </th>
                                    <th className="px-4 py-2 text-left cursor-pointer" onClick={() => handleSort('okr')}>
                                        OKR {sortConfig.key === 'okr' && (sortConfig.direction === 'asc' ? '↑' : '↓')}
                                    </th>
                                    <th className="px-4 py-2 text-left cursor-pointer" onClick={() => handleSort('source')}>
                                        Source {sortConfig.key === 'source' && (sortConfig.direction === 'asc' ? '↑' : '↓')}
                                    </th>
                                    <th className="px-4 py-2 text-left cursor-pointer" onClick={() => handleSort('stage')}>
                                        Stage {sortConfig.key === 'stage' && (sortConfig.direction === 'asc' ? '↑' : '↓')}
                                    </th>
                                    <th className="px-4 py-2 text-left cursor-pointer" onClick={() => handleSort('probability')}>
                                        Probability {sortConfig.key === 'probability' && (sortConfig.direction === 'asc' ? '↑' : '↓')}
                                    </th>
                                    <th className="px-4 py-2 text-left cursor-pointer" onClick={() => handleSort('impact')}>
                                        Impact {sortConfig.key === 'impact' && (sortConfig.direction === 'asc' ? '↑' : '↓')}
                                    </th>
                                    <th className="px-4 py-2 text-left cursor-pointer" onClick={() => handleSort('effort')}>
                                        Effort {sortConfig.key === 'effort' && (sortConfig.direction === 'asc' ? '↑' : '↓')}
                                    </th>
                                    <th className="px-4 py-2 text-left cursor-pointer" onClick={() => handleSort('durationWeeks')}>
                                        Duration {sortConfig.key === 'durationWeeks' && (sortConfig.direction === 'asc' ? '↑' : '↓')}
                                    </th>
                                    <th className="px-4 py-2 text-left">Resources</th>
                                    <th className="px-4 py-2 text-left cursor-pointer" onClick={() => handleSort('startWeek')}>
                                        Start Week {sortConfig.key === 'startWeek' && (sortConfig.direction === 'asc' ? '↑' : '↓')}
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                {filteredProjects.map(project => (
                                    <tr key={project.id} className="border-b hover:bg-gray-50">
                                        <td className="px-4 py-2">
                                            {editingNameId === project.id ? (
                                                <div>
                                                    <input
                                                        type="text"
                                                        autoFocus
                                                        value={editingNameValue}
                                                        onChange={(e) => { setEditingNameValue(e.target.value); setNameError(''); }}
                                                        onKeyDown={handleNameKeyDown}
                                                        onBlur={saveNameEdit}
                                                        className={`px-2 py-1 border rounded text-sm w-full ${nameError ? 'border-red-500' : 'border-blue-500'}`}
                                                    />
                                                    {nameError && <div className="text-xs text-red-600 mt-0.5">{nameError}</div>}
                                                </div>
                                            ) : (
                                                <button
                                                    onClick={() => startNameEdit(project)}
                                                    onDoubleClick={() => dispatch({ type: 'SET_MODAL', payload: project.id })}
                                                    className="text-blue-600 hover:underline text-left"
                                                    title="Click to rename, double-click to open details"
                                                >
                                                    {project.name}
                                                </button>
                                            )}
                                        </td>
                                        <td className="px-4 py-2">{project.sponsor}</td>
                                        <td className="px-4 py-2">
                                            <span className="px-2 py-1 rounded text-xs bg-blue-100 text-blue-800">
                                                {project.okr}
                                            </span>
                                        </td>
                                        <td className="px-4 py-2">
                                            <span className={`px-2 py-1 rounded text-xs ${project.source === 'Internal' ? 'bg-purple-100 text-purple-800' : 'bg-gray-100 text-gray-800'}`}>
                                                {project.source}
                                            </span>
                                        </td>
                                        <td className="px-4 py-2">
                                            <span className={`px-2 py-1 rounded text-xs ${stageColors[project.stage].bg} text-white`}>
                                                {project.stage}
                                            </span>
                                        </td>
                                        <td className="px-4 py-2">{project.probability}%</td>
                                        <td className="px-4 py-2">{project.impact}</td>
                                        <td className="px-4 py-2">{project.effort}</td>
                                        <td className="px-4 py-2">{project.durationWeeks}w</td>
                                        <td className="px-4 py-2 text-sm">
                                            DS:{project.resources.dataScientists} GS:{project.resources.geoscientists} PM:{project.resources.projectManagers}
                                        </td>
                                        <td className="px-4 py-2">
                                            {project.startWeek ? (
                                                <div>
                                                    <div className="font-medium">Week {project.startWeek}</div>
                                                    <div className="text-xs text-gray-600">{formatDate(getDateFromWeek(project.startWeek))}</div>
                                                </div>
                                            ) : (
                                                <span className="text-gray-400">Unscheduled</span>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <div className="mt-4 text-sm text-gray-600">
                        Showing {filteredProjects.length} of {state.projects.length} projects
                    </div>
                </div>
            );
        };

        // Timeline View Component
        const TimelineView = () => {
            const { state, dispatch } = useContext(AppContext);
            const [draggedProject, setDraggedProject] = useState(null);

            const scheduledProjects = state.projects.filter(p => p.startWeek !== null);
            const unscheduledProjects = state.projects.filter(p => p.startWeek === null);

            const handleDragStart = (e, project) => {
                setDraggedProject(project);
                e.dataTransfer.effectAllowed = 'move';
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            };

            const handleDrop = (e, week) => {
                e.preventDefault();
                if (draggedProject) {
                    dispatch({
                        type: 'UPDATE_PROJECT',
                        payload: {
                            id: draggedProject.id,
                            updates: { startWeek: week }
                        }
                    });
                    setDraggedProject(null);
                }
            };

            const weeks = Array.from({ length: 52 }, (_, i) => i + 1);

            // Group projects based on groupBy setting
            const groupedProjects = useMemo(() => {
                if (state.ui.timelineGroupBy === 'none') {
                    return { 'All Projects': scheduledProjects };
                }

                const groups = {};
                const groupKey = state.ui.timelineGroupBy === 'stage' ? 'stage' : 'okr';

                scheduledProjects.forEach(project => {
                    const group = project[groupKey];
                    if (!groups[group]) {
                        groups[group] = [];
                    }
                    groups[group].push(project);
                });

                return groups;
            }, [scheduledProjects, state.ui.timelineGroupBy]);

            return (
                <div className="flex">
                    <div className="w-64 border-r pr-4 flex-shrink-0">
                        <h3 className="font-bold mb-2 text-lg">Unscheduled ({unscheduledProjects.length})</h3>
                        <div className="text-xs text-gray-600 mb-3">Drag to timeline to schedule</div>
                        <div className="space-y-2">
                            {unscheduledProjects.map(project => (
                                <div
                                    key={project.id}
                                    draggable
                                    onDragStart={(e) => handleDragStart(e, project)}
                                    className={`p-2 rounded cursor-move ${stageColors[project.stage].bg} text-white text-sm`}
                                >
                                    <div className="font-medium">{project.name}</div>
                                    <div className="text-xs">{project.durationWeeks}w | DS:{project.resources.dataScientists} GS:{project.resources.geoscientists} PM:{project.resources.projectManagers}</div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="flex-1 overflow-x-auto pl-4">
                        <div className="mb-4 flex justify-between items-center">
                            <div className="flex gap-2">
                                <button
                                    onClick={() => dispatch({ type: 'SET_TIMELINE_GROUP_BY', payload: 'stage' })}
                                    className={`px-3 py-1 rounded ${state.ui.timelineGroupBy === 'stage' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}
                                >
                                    Group by Stage
                                </button>
                            <button
                                onClick={() => dispatch({ type: 'SET_TIMELINE_GROUP_BY', payload: 'okr' })}
                                className={`px-3 py-1 rounded ${state.ui.timelineGroupBy === 'okr' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}
                            >
                                Group by OKR
                            </button>
                            <button
                                onClick={() => dispatch({ type: 'SET_TIMELINE_GROUP_BY', payload: 'none' })}
                                className={`px-3 py-1 rounded ${state.ui.timelineGroupBy === 'none' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}
                            >
                                No Grouping
                            </button>
                            </div>
                            <div className="text-sm text-gray-600 font-medium">
                                2026 Timeline (52 weeks)
                            </div>
                        </div>

                        <div className="relative" style={{ minWidth: '2000px' }}>
                            {/* Month headers */}
                            <div className="flex mb-2 border-b-2 border-blue-500">
                                {getMonthsFor2026().map((month, idx) => {
                                    const monthWidth = (month.weekEnd - month.weekStart + 1) * 40;
                                    return (
                                        <div
                                            key={idx}
                                            className="flex-shrink-0 text-center font-bold text-base text-blue-700 py-2 border-r border-gray-300"
                                            style={{ width: `${monthWidth}px` }}
                                        >
                                            {month.name} 2026
                                        </div>

                                })}
                            </div>
                            {/* Week numbers */}

                                {weeks.map(week => (
                                    <div key={week} className="flex-shrink-0 text-center text-xs font-semibold text-gray-700" style={{ width: '40px' }}>
                                        {week}
                                    </div>
                                ))}
                            </div>

                            {Object.entries(groupedProjects).map(([groupName, projects]) => (
                                <div key={groupName} className="mb-6">
                                    {state.ui.timelineGroupBy !== 'none' && (
                                        <div className="font-bold text-sm mb-2 text-gray-700">{groupName}</div>
                                    )}
                                    {projects.map((project, idx) => (
                                        <div
                                            key={project.id}
                                            className="mb-2 relative"
                                            style={{ height: '50px' }}
                                        >
                                            <div
                                                draggable
                                                onDragStart={(e) => handleDragStart(e, project)}

                                                className={`timeline-bar absolute ${stageColors[project.stage].bg} text-white p-2 rounded text-xs cursor-pointer`}
                                                style={{
                                                    left: `${(project.startWeek - 1) * 40}px`,
                                                    width: `${project.durationWeeks * 40}px`,
                                                    opacity: project.probability / 100,
                                                    top: 0

                                                <div className="font-medium truncate">{project.name}</div>
                                                <div className="text-xs">DS:{project.resources.dataScientists} GS:{project.resources.geoscientists} PM:{project.resources.projectManagers}</div>

        // Simple Stacked Bar Chart Component
        const SimpleStackedChart = ({ data, capacity, title, dataKeys, segmentColors, segmentLabels }) => {
            const [hoveredWeek, setHoveredWeek] = useState(null);

            const maxValue = Math.max(capacity * 1.2, ...data.map(d =>
                dataKeys.reduce((sum, key) => sum + (d[key] || 0), 0)
            ));

            return (
                <div>
                    <h3 className="text-lg font-bold mb-4">{title}</h3>
                    <div className="relative bg-white border rounded p-4" style={{ height: '250px' }}>
                        <div className="flex h-full items-end gap-px">
                            {data.map((weekData, idx) => {
                                const total = dataKeys.reduce((sum, key) => sum + (weekData[key] || 0), 0);
                                const barHeight = (total / maxValue) * 100;
                                const pct = capacity > 0 ? Math.round(total / capacity * 100) : 0;
                                const overCapacity = total > capacity;
                                const tooltipAlign = idx / data.length < 0.1
                                    ? 'left-0'
                                    : idx / data.length > 0.9
                                        ? 'right-0'
                                        : 'left-1/2 transform -translate-x-1/2';

                                return (
                                    <div
                                        key={idx}
                                        className="flex-1 flex flex-col justify-end relative cursor-pointer"
                                        onMouseEnter={() => setHoveredWeek(idx)}
                                        onMouseLeave={() => setHoveredWeek(null)}
                                        style={{ height: '100%' }}
                                    >
                                        <div className="flex flex-col justify-end" style={{ height: `${barHeight}%`, transition: 'height 300ms ease' }}>
                                            {[...dataKeys].reverse().map(key => (
                                                <div key={key} style={{ height: `${(weekData[key] || 0) / total * 100}%`, backgroundColor: segmentColors[key], transition: 'height 300ms ease' }} />
                                            ))}
                                        </div>

                                        {hoveredWeek === idx && total > 0 && (
                                            <div className={`absolute bottom-full mb-2 bg-gray-900 text-white text-xs rounded px-2 py-1 whitespace-nowrap z-10 ${tooltipAlign}`}>
                                                <div className="font-bold mb-1">Week {weekData.week}</div>
                                                {dataKeys.filter(key => (weekData[key] || 0) > 0).map(key => (
                                                    <div key={key} className="flex items-center gap-1">
                                                        <div className="w-2 h-2 rounded-sm flex-shrink-0" style={{ backgroundColor: segmentColors[key] }}></div>
                                                        <span>{segmentLabels[key]}: {weekData[key]}</span>
                                                    </div>
                                                ))}
                                                <div className={`font-bold mt-1 pt-1 border-t border-gray-600 ${overCapacity ? 'text-red-400' : 'text-green-400'}`}>
                                                    {overCapacity ? '⚠ ' : ''}Total: {total} / {capacity} ({pct}%)
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                        <div
                            className="absolute left-0 right-0 border-t-2 border-red-500 border-dashed"
                            style={{ bottom: `${(capacity / maxValue) * 100}%` }}
                        >
                            <span className="absolute right-0 -top-3 text-xs text-red-600 bg-white px-1">
                                Capacity: {capacity}
                            </span>
                        </div>
                    </div>
                    <div className="flex flex-wrap gap-x-4 gap-y-2 mt-2 text-xs overflow-y-auto" style={{ maxHeight: '72px' }}>
                        {dataKeys.map(key => (
                            <div key={key} className="flex items-center gap-1">
                                <div className="w-3 h-3 rounded-sm flex-shrink-0" style={{ backgroundColor: segmentColors[key] }}></div>
                                <span>{segmentLabels[key]}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // Resource Allocation constants
        const RA_STAGES = ['Signed', 'Close to Signing', 'Interested', 'Frontier'];
        const RA_STATUS_HEX = { 'Signed': '#22c55e', 'Close to Signing': '#3b82f6', 'Interested': '#f59e0b', 'Frontier': '#6b7280' };
        const RA_PROJECT_PALETTE = ['#4e79a7','#f28e2b','#e15759','#76b7b2','#59a14f','#edc948','#b07aa1','#ff9da7','#9c755f','#bab0ac'];

        // Person Heat-map Sub-view
        const PersonHeatmapView = ({ visibleStages }) => {
            const { state } = useContext(AppContext);
            const [hoveredCell, setHoveredCell] = useState(null); // { personId, week }
            const [collapsedRoles, setCollapsedRoles] = useState({});
            const people = state.people || [];
            const projects = useMemo(() =>
                state.projects.filter(p => visibleStages[p.stage]),
                [state.projects, visibleStages]
            );

            const ROLES = ['Data Scientist', 'Geoscientist', 'Project Manager'];

            const cellColor = (load, capacity) => {
                if (load === 0) return '#f3f4f6'; // gray-100
                const pct = load / capacity;
                if (pct > 1.0) return '#ef4444'; // red
                if (pct >= 1.0) return '#16a34a'; // dark green
                if (pct >= 0.5) return '#4ade80'; // medium green
                return '#bbf7d0'; // light green
            };

            const weekNumbers = Array.from({ length: 52 }, (_, i) => i + 1);

            // Pre-compute load for every person × week
            const loadMap = useMemo(() => {
                const m = {};
                people.forEach(person => {
                    m[person.id] = {};
                    weekNumbers.forEach(w => {
                        m[person.id][w] = getPersonWeekLoad(person.id, w, projects);
                    });
                });
                return m;
            }, [people, projects]);

            const toggleRole = (role) =>
                setCollapsedRoles(prev => ({ ...prev, [role]: !prev[role] }));

            return (
                <div className="overflow-x-auto">
                    <div style={{ minWidth: '1100px' }}>
                        {ROLES.map(role => {
                            const rolePeople = people.filter(p => p.role === role);
                            if (rolePeople.length === 0) return null;
                            const collapsed = collapsedRoles[role];

                            // Aggregate utilization for the role group header
                            const roleCapTotal = rolePeople.reduce((s, p) => s + p.capacity, 0);
                            const roleLoadAvg = roleCapTotal > 0
                                ? Math.round(rolePeople.reduce((s, p) => s + Object.values(loadMap[p.id] || {}).reduce((a, b) => a + b, 0), 0) / (roleCapTotal * 52) * 100)
                                : 0;

                            return (
                                <div key={role} className="mb-6">
                                    <div
                                        className="flex items-center gap-2 mb-2 cursor-pointer select-none"
                                        onClick={() => toggleRole(role)}
                                    >
                                        <span className="text-sm font-bold text-gray-700">{collapsed ? '▶' : '▼'}</span>
                                        <span className="font-bold text-gray-700">{role}s</span>
                                        <span className="text-xs text-gray-500">({rolePeople.length} people · avg {roleLoadAvg}% utilization)</span>
                                    </div>

                                    {!collapsed && (
                                        <div>
                                            {/* Week header */}
                                            <div className="flex mb-1">
                                                <div style={{ width: '140px', flexShrink: 0 }} />
                                                {weekNumbers.map(w => (
                                                    <div key={w} style={{ width: '18px', flexShrink: 0, fontSize: '9px', textAlign: 'center', color: '#9ca3af' }}>
                                                        {w % 4 === 1 ? w : ''}
                                                    </div>
                                                ))}
                                            </div>
                                            {rolePeople.map(person => (
                                                <div key={person.id} className="flex items-center mb-0.5 relative">
                                                    <div style={{ width: '140px', flexShrink: 0, fontSize: '12px', paddingRight: '8px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                                                        {person.name}
                                                    </div>
                                                    {weekNumbers.map(w => {
                                                        const load = loadMap[person.id]?.[w] || 0;
                                                        const isHovered = hoveredCell?.personId === person.id && hoveredCell?.week === w;
                                                        const projectsThisWeek = projects.filter(p =>
                                                            p.startWeek !== null &&
                                                            p.startWeek <= w && p.startWeek + p.durationWeeks > w &&
                                                            (p.assignedPeople || []).some(a => a.personId === person.id)
                                                        );

                                                        return (
                                                            <div
                                                                key={w}
                                                                style={{
                                                                    width: '18px', height: '18px', flexShrink: 0,
                                                                    backgroundColor: cellColor(load, person.capacity),
                                                                    border: isHovered ? '2px solid #1d4ed8' : '1px solid #e5e7eb',
                                                                    cursor: load > 0 ? 'pointer' : 'default',
                                                                    position: 'relative',
                                                                }}
                                                                onMouseEnter={() => setHoveredCell({ personId: person.id, week: w })}
                                                                onMouseLeave={() => setHoveredCell(null)}
                                                            >
                                                                {isHovered && load > 0 && (
                                                                    <div style={{
                                                                        position: 'absolute', bottom: '100%', left: '50%', transform: 'translateX(-50%)',
                                                                        backgroundColor: '#1f2937', color: 'white', borderRadius: '4px',
                                                                        padding: '6px 8px', zIndex: 50, minWidth: '180px', fontSize: '11px',
                                                                        whiteSpace: 'nowrap',
                                                                    }}>
                                                                        <div className="font-bold mb-1">{person.name} — Week {w}</div>
                                                                        {projectsThisWeek.map(p => {
                                                                            const a = (p.assignedPeople || []).find(a => a.personId === person.id);
                                                                            return (
                                                                                <div key={p.id} className="flex justify-between gap-4">
                                                                                    <span className="truncate max-w-28">{p.name}</span>
                                                                                    <span>{a?.fraction?.toFixed(2)}</span>
                                                                                </div>
                                                                            );
                                                                        })}
                                                                        <div style={{ borderTop: '1px solid #4b5563', marginTop: '4px', paddingTop: '4px' }}
                                                                            className={load > person.capacity ? 'text-red-400 font-bold' : 'text-green-400'}>
                                                                            Total: {load.toFixed(2)} / {person.capacity.toFixed(2)} ({Math.round(load / person.capacity * 100)}%)
                                                                        </div>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            );
                        })}

                        {people.length === 0 && (
                            <div className="text-gray-400 text-sm py-8 text-center">
                                No people in roster yet. Add team members in the People tab.
                            </div>
                        )}

                        {/* Legend */}
                        <div className="flex items-center gap-4 mt-4 text-xs text-gray-600">
                            {[
                                { color: '#bbf7d0', label: '< 50%' },
                                { color: '#4ade80', label: '50–99%' },
                                { color: '#16a34a', label: '100%' },
                                { color: '#ef4444', label: '> 100% (over)' },
                                { color: '#f3f4f6', label: 'Unassigned' },
                            ].map(({ color, label }) => (
                                <div key={label} className="flex items-center gap-1">
                                    <div style={{ width: 14, height: 14, backgroundColor: color, border: '1px solid #e5e7eb' }} />
                                    {label}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // Resource Allocation View Component
        const ResourceAllocationView = () => {
            const { state, dispatch } = useContext(AppContext);
            const [colorBy, setColorBy] = useState('status');
            const resourceView = state.ui.resourceView || 'byRole';

            // Maturity visibility — persisted to localStorage
            const [visibleStages, setVisibleStages] = useState(() => {
                try {
                    const saved = localStorage.getItem('ra_visibleStages');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        // Ensure all current stages are present (handles new stages added later)
                        return Object.fromEntries(RA_STAGES.map(s => [s, parsed[s] !== false]));
                    }
                } catch {}
                return Object.fromEntries(RA_STAGES.map(s => [s, true]));
            });

            useEffect(() => {
                localStorage.setItem('ra_visibleStages', JSON.stringify(visibleStages));
            }, [visibleStages]);

            const toggleStage = stage =>
                setVisibleStages(prev => ({ ...prev, [stage]: !prev[stage] }));

            // Status-mode: aggregate hours per stage per week
            const chartData = useMemo(() => {
                const data = [];
                for (let week = 1; week <= 52; week++) {
                    const weekData = { week };
                    RA_STAGES.forEach(stage => {
                        const projects = state.projects.filter(p =>
                            p.stage === stage &&
                            p.startWeek !== null &&
                            p.startWeek <= week &&
                            p.startWeek + p.durationWeeks > week
                        );
                        weekData[`${stage}_ds`] = projects.reduce((sum, p) => sum + p.resources.dataScientists, 0);
                        weekData[`${stage}_gs`] = projects.reduce((sum, p) => sum + p.resources.geoscientists, 0);
                        weekData[`${stage}_pm`] = projects.reduce((sum, p) => sum + p.resources.projectManagers, 0);
                    });
                    data.push(weekData);
                }
                return data;
            }, [state.projects]);

            // Project-mode: scheduled projects sorted by stage order (Signed first → Frontier last)
            const scheduledProjects = useMemo(() =>
                [...state.projects.filter(p => p.startWeek !== null)]
                    .sort((a, b) => RA_STAGES.indexOf(a.stage) - RA_STAGES.indexOf(b.stage)),
                [state.projects]
            );

            // Stable color assignment: project id → palette hex
            const projectPalette = useMemo(() => {
                const m = {};
                scheduledProjects.forEach((p, i) => { m[p.id] = RA_PROJECT_PALETTE[i % RA_PROJECT_PALETTE.length]; });
                return m;
            }, [scheduledProjects]);

            // Project-mode: per-project hours per week
            const projectChartData = useMemo(() => {
                const data = [];
                for (let week = 1; week <= 52; week++) {
                    const weekData = { week };
                    scheduledProjects.forEach(p => {
                        const active = p.startWeek <= week && p.startWeek + p.durationWeeks > week;
                        weekData[`${p.id}_ds`] = active ? p.resources.dataScientists : 0;
                        weekData[`${p.id}_gs`] = active ? p.resources.geoscientists : 0;
                        weekData[`${p.id}_pm`] = active ? p.resources.projectManagers : 0;
                    });
                    data.push(weekData);
                }
                return data;
            }, [scheduledProjects]);

            // Build props for each chart — filter by visibleStages at the dataKeys level
            const getChartProps = (suffix, capacity, title) => {
                if (colorBy === 'status') {
                    const activeStages = RA_STAGES.filter(s => visibleStages[s]);
                    return {
                        data: chartData,
                        dataKeys: activeStages.map(s => `${s}_${suffix}`),
                        segmentColors: Object.fromEntries(activeStages.map(s => [`${s}_${suffix}`, RA_STATUS_HEX[s]])),
                        segmentLabels: Object.fromEntries(activeStages.map(s => [`${s}_${suffix}`, s])),
                        capacity,
                        title
                    };
                }
                const activeProjects = scheduledProjects.filter(p => visibleStages[p.stage]);
                return {
                    data: projectChartData,
                    dataKeys: activeProjects.map(p => `${p.id}_${suffix}`),
                    segmentColors: Object.fromEntries(activeProjects.map(p => [`${p.id}_${suffix}`, projectPalette[p.id]])),
                    segmentLabels: Object.fromEntries(activeProjects.map(p => [`${p.id}_${suffix}`, p.name])),
                    capacity,
                    title
                };
            };

            return (
                <div className="space-y-6">
                    {/* Toolbar */}
                    <div className="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-gray-200">
                        {/* View toggle */}
                        <div className="flex items-center gap-1 bg-gray-100 rounded-lg p-1">
                            <button
                                onClick={() => dispatch({ type: 'SET_RESOURCE_VIEW', payload: 'byRole' })}
                                className={`px-3 py-1 rounded-md text-sm font-medium transition-colors ${resourceView === 'byRole' ? 'bg-white shadow text-blue-700' : 'text-gray-600 hover:text-gray-900'}`}
                            >
                                By Role
                            </button>
                            <button
                                onClick={() => dispatch({ type: 'SET_RESOURCE_VIEW', payload: 'byPerson' })}
                                className={`px-3 py-1 rounded-md text-sm font-medium transition-colors ${resourceView === 'byPerson' ? 'bg-white shadow text-blue-700' : 'text-gray-600 hover:text-gray-900'}`}
                            >
                                By Person
                            </button>
                        </div>

                        <div className="flex flex-wrap items-center gap-3">
                            <div className="flex flex-wrap gap-2">
                                {RA_STAGES.map(stage => {
                                    const active = visibleStages[stage];
                                    const hex = RA_STATUS_HEX[stage];
                                    return (
                                        <label
                                            key={stage}
                                            className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium cursor-pointer select-none border-2 transition-all duration-200"
                                            style={active
                                                ? { backgroundColor: hex, borderColor: hex, color: 'white' }
                                                : { backgroundColor: 'white', borderColor: hex, color: hex }
                                            }
                                        >
                                            <input
                                                type="checkbox"
                                                className="w-3.5 h-3.5 cursor-pointer"
                                                style={{ accentColor: active ? 'white' : hex }}
                                                checked={active}
                                                onChange={() => toggleStage(stage)}
                                            />
                                            {stage}
                                        </label>
                                    );
                                })}
                            </div>
                            {resourceView === 'byRole' && (
                                <div className="flex items-center gap-2">
                                    <label className="text-sm font-medium text-gray-600">Color By</label>
                                    <select
                                        className="text-sm border rounded px-2 py-1 bg-white"
                                        value={colorBy}
                                        onChange={e => setColorBy(e.target.value)}
                                    >
                                        <option value="status">Status / Maturity</option>
                                        <option value="project">Project Name</option>
                                    </select>
                                </div>
                            )}
                        </div>
                    </div>

                    {resourceView === 'byRole' ? (
                        <>
                            <SimpleStackedChart {...getChartProps('ds', state.settings.capacity.dataScientists, 'Data Scientists')} />
                            <SimpleStackedChart {...getChartProps('gs', state.settings.capacity.geoscientists, 'Geoscientists')} />
                            <SimpleStackedChart {...getChartProps('pm', state.settings.capacity.projectManagers, 'Project Managers')} />
                        </>
                    ) : (
                        <PersonHeatmapView visibleStages={visibleStages} />
                    )}
                </div>
            );
        };

        // Forecast View Component
        const ForecastView = () => {
            const { state } = useContext(AppContext);

            const scenarios = useMemo(() => {
                const weeksPerYear = 52;
                const totalCapacity = {
                    ds: state.settings.capacity.dataScientists * weeksPerYear,
                    gs: state.settings.capacity.geoscientists * weeksPerYear,
                    pm: state.settings.capacity.projectManagers * weeksPerYear
                };

                const calculateScenario = (filter) => {
                    const projects = state.projects.filter(filter);
                    return {
                        ds: projects.reduce((sum, p) => sum + (p.resources.dataScientists * p.durationWeeks), 0),
                        gs: projects.reduce((sum, p) => sum + (p.resources.geoscientists * p.durationWeeks), 0),
                        pm: projects.reduce((sum, p) => sum + (p.resources.projectManagers * p.durationWeeks), 0)
                    };
                };

                return {
                    committed: calculateScenario(p => p.stage === 'Signed'),
                    highConfidence: calculateScenario(p => ['Signed', 'Close to Signing'].includes(p.stage)),
                    expected: {
                        ds: state.projects.reduce((sum, p) => sum + (p.resources.dataScientists * p.durationWeeks * p.probability / 100), 0),
                        gs: state.projects.reduce((sum, p) => sum + (p.resources.geoscientists * p.durationWeeks * p.probability / 100), 0),
                        pm: state.projects.reduce((sum, p) => sum + (p.resources.projectManagers * p.durationWeeks * p.probability / 100), 0)
                    },
                    fullPipeline: calculateScenario(() => true),
                    totalCapacity
                };
            }, [state.projects, state.settings.capacity]);

            const ScenarioCard = ({ title, data, capacity }) => (
                <div className="border rounded-lg p-6 bg-white shadow-sm">
                    <h3 className="text-xl font-bold mb-4">{title}</h3>
                    <div className="space-y-2">
                        <div>
                            <div className="flex justify-between">
                                <span>DS: {Math.round(data.ds)} person-weeks</span>
                                <span className={data.ds > capacity.ds ? 'text-red-600 font-bold' : 'text-green-600'}>
                                    {Math.round((data.ds / capacity.ds) * 100)}%
                                </span>
                            </div>
                            <div className="w-full bg-gray-200 rounded-full h-2 mt-1">
                                <div
                                    className={`h-2 rounded-full ${data.ds > capacity.ds ? 'bg-red-600' : 'bg-green-600'}`}
                                    style={{ width: `${Math.min((data.ds / capacity.ds) * 100, 100)}%` }}
                                />
                            </div>
                        </div>
                        <div>
                            <div className="flex justify-between">
                                <span>GS: {Math.round(data.gs)} person-weeks</span>
                                <span className={data.gs > capacity.gs ? 'text-red-600 font-bold' : 'text-green-600'}>
                                    {Math.round((data.gs / capacity.gs) * 100)}%
                                </span>
                            </div>
                            <div className="w-full bg-gray-200 rounded-full h-2 mt-1">
                                <div
                                    className={`h-2 rounded-full ${data.gs > capacity.gs ? 'bg-red-600' : 'bg-green-600'}`}
                                    style={{ width: `${Math.min((data.gs / capacity.gs) * 100, 100)}%` }}
                                />
                            </div>
                        </div>
                        <div>
                            <div className="flex justify-between">
                                <span>PM: {Math.round(data.pm)} person-weeks</span>
                                <span className={data.pm > capacity.pm ? 'text-red-600 font-bold' : 'text-green-600'}>
                                    {Math.round((data.pm / capacity.pm) * 100)}%
                                </span>
                            </div>
                            <div className="w-full bg-gray-200 rounded-full h-2 mt-1">
                                <div
                                    className={`h-2 rounded-full ${data.pm > capacity.pm ? 'bg-red-600' : 'bg-green-600'}`}
                                    style={{ width: `${Math.min((data.pm / capacity.pm) * 100, 100)}%` }}
                                />
                            </div>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="space-y-6">
                    <div className="grid grid-cols-2 gap-6">
                        <ScenarioCard
                            title="Committed Only"
                            data={scenarios.committed}
                            capacity={scenarios.totalCapacity}
                        />
                        <ScenarioCard
                            title="High Confidence"
                            data={scenarios.highConfidence}
                            capacity={scenarios.totalCapacity}
                        />
                        <ScenarioCard
                            title="Expected Case (Probability-Weighted)"
                            data={scenarios.expected}
                            capacity={scenarios.totalCapacity}
                        />
                        <ScenarioCard
                            title="Full Pipeline"
                            data={scenarios.fullPipeline}
                            capacity={scenarios.totalCapacity}
                        />
                    </div>
                </div>
            );
        };

        // Cross-Plot Analysis View Component
        const CrossPlotView = () => {
            const { state, dispatch } = useContext(AppContext);
            const [xAxis, setXAxis] = useState('probability');
            const [yAxis, setYAxis] = useState('impact');
            const [hoveredProject, setHoveredProject] = useState(null);

            const axisOptions = [
                { value: 'probability', label: 'Probability (%)', min: 0, max: 100 },
                { value: 'impact', label: 'Impact', values: ['Low', 'Medium', 'High'] },
                { value: 'effort', label: 'Effort', values: ['S', 'M', 'L'] },
                { value: 'durationWeeks', label: 'Duration (weeks)', min: 0, max: null }
            ];

            const getAxisValue = (project, axis) => {
                if (axis === 'probability') return project.probability;
                if (axis === 'durationWeeks') return project.durationWeeks;
                if (axis === 'impact') {
                    return { 'Low': 1, 'Medium': 2, 'High': 3 }[project.impact] || 2;
                }
                if (axis === 'effort') {
                    return { 'S': 1, 'M': 2, 'L': 3 }[project.effort] || 2;
                }
                return 0;
            };

            const getAxisLabel = (value, axis) => {
                if (axis === 'impact') {
                    return ['', 'Low', 'Medium', 'High'][value] || value;
                }
                if (axis === 'effort') {
                    return ['', 'S', 'M', 'L'][value] || value;
                }
                return value;
            };

            const getAxisConfig = (axis) => {
                return axisOptions.find(opt => opt.value === axis);
            };

            // Calculate min/max for continuous axes
            const xConfig = getAxisConfig(xAxis);
            const yConfig = getAxisConfig(yAxis);

            const xMin = xConfig.min !== undefined ? xConfig.min :
                         Math.min(...state.projects.map(p => getAxisValue(p, xAxis)));
            const xMax = xConfig.max !== undefined ? xConfig.max :
                         Math.max(...state.projects.map(p => getAxisValue(p, xAxis)));

            const yMin = yConfig.min !== undefined ? yConfig.min :
                         Math.min(...state.projects.map(p => getAxisValue(p, yAxis)));
            const yMax = yConfig.max !== undefined ? yConfig.max :
                         Math.max(...state.projects.map(p => getAxisValue(p, yAxis)));

            // Plot dimensions
            const plotWidth = 700;
            const plotHeight = 500;
            const padding = 60;

            // Convert value to pixel position with anti-clustering
            const valueToPixel = (value, min, max, dimension) => {
                const range = max - min || 1;
                return ((value - min) / range) * (dimension - 2 * padding) + padding;
            };

            // Anti-clustering: add small random offset to overlapping points
            const getPointPositions = useMemo(() => {
                const positions = {};
                const jitterAmount = 8;

                state.projects.forEach(project => {
                    const baseX = valueToPixel(getAxisValue(project, xAxis), xMin, xMax, plotWidth);
                    const baseY = plotHeight - valueToPixel(getAxisValue(project, yAxis), yMin, yMax, plotHeight);

                    // Check for nearby points
                    let finalX = baseX;
                    let finalY = baseY;
                    let attempts = 0;
                    let tooClose = true;

                    while (tooClose && attempts < 20) {
                        tooClose = false;
                        for (const [id, pos] of Object.entries(positions)) {
                            const dist = Math.sqrt(Math.pow(finalX - pos.x, 2) + Math.pow(finalY - pos.y, 2));
                            if (dist < 20) {
                                tooClose = true;
                                break;
                            }
                        }
                        if (tooClose) {
                            finalX = baseX + (Math.random() - 0.5) * jitterAmount;
                            finalY = baseY + (Math.random() - 0.5) * jitterAmount;
                            attempts++;
                        }
                    }

                    positions[project.id] = { x: finalX, y: finalY };
                });

                return positions;
            }, [state.projects, xAxis, yAxis, xMin, xMax, yMin, yMax]);

            // Grid lines
            const xGridLines = xConfig.values ?
                [1, 2, 3] :
                [0, 0.25, 0.5, 0.75, 1].map(t => xMin + t * (xMax - xMin));

            const yGridLines = yConfig.values ?
                [1, 2, 3] :
                [0, 0.25, 0.5, 0.75, 1].map(t => yMin + t * (yMax - yMin));

            return (
                <div>
                    <div className="mb-6 flex gap-6">
                        <div>
                            <label className="block text-sm font-medium mb-2">X-Axis</label>
                            <select
                                value={xAxis}
                                onChange={(e) => setXAxis(e.target.value)}
                                className="px-4 py-2 border border-gray-300 rounded-md"
                            >
                                {axisOptions.map(opt => (
                                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                                ))}
                            </select>
                        </div>
                        <div>
                            <label className="block text-sm font-medium mb-2">Y-Axis</label>
                            <select
                                value={yAxis}
                                onChange={(e) => setYAxis(e.target.value)}
                                className="px-4 py-2 border border-gray-300 rounded-md"
                            >
                                {axisOptions.map(opt => (
                                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                                ))}
                            </select>
                        </div>
                    </div>

                    <div className="bg-white border rounded-lg p-4">
                        <svg width={plotWidth} height={plotHeight} className="border border-gray-200">
                            {/* Grid lines */}
                            {xGridLines.map((value, i) => {
                                const x = valueToPixel(value, xMin, xMax, plotWidth);
                                return (
                                    <g key={`x-grid-${i}`}>
                                        <line x1={x} y1={padding} x2={x} y2={plotHeight - padding}
                                            stroke="#e5e7eb" strokeWidth="1" />
                                        <text x={x} y={plotHeight - padding + 20}
                                            textAnchor="middle" fontSize="12" fill="#6b7280">
                                            {getAxisLabel(Math.round(value), xAxis)}
                                        </text>
                                    </g>
                                );
                            })}

                            {yGridLines.map((value, i) => {
                                const y = plotHeight - valueToPixel(value, yMin, yMax, plotHeight);
                                return (
                                    <g key={`y-grid-${i}`}>
                                        <line x1={padding} y1={y} x2={plotWidth - padding} y2={y}
                                            stroke="#e5e7eb" strokeWidth="1" />
                                        <text x={padding - 10} y={y + 4}
                                            textAnchor="end" fontSize="12" fill="#6b7280">
                                            {getAxisLabel(Math.round(value), yAxis)}
                                        </text>
                                    </g>
                                );
                            })}

                            {/* Axes */}
                            <line x1={padding} y1={plotHeight - padding} x2={plotWidth - padding} y2={plotHeight - padding}
                                stroke="#374151" strokeWidth="2" />
                            <line x1={padding} y1={padding} x2={padding} y2={plotHeight - padding}
                                stroke="#374151" strokeWidth="2" />

                            {/* Axis labels */}
                            <text x={plotWidth / 2} y={plotHeight - 10}
                                textAnchor="middle" fontSize="14" fontWeight="bold" fill="#1f2937">
                                {xConfig.label}
                            </text>
                            <text x={20} y={plotHeight / 2}
                                textAnchor="middle" fontSize="14" fontWeight="bold" fill="#1f2937"
                                transform={`rotate(-90, 20, ${plotHeight / 2})`}>
                                {yConfig.label}
