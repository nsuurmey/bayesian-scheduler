                            </text>

                            {/* Data points */}
                            {state.projects.map(project => {
                                const pos = getPointPositions[project.id];
                                const color = stageColors[project.stage].hex;
                                const isHovered = hoveredProject === project.id;

                                return (
                                    <g key={project.id}>
                                        <circle
                                            cx={pos.x}
                                            cy={pos.y}
                                            r={isHovered ? 8 : 6}
                                            fill={color}
                                            stroke={isHovered ? '#1f2937' : '#fff'}
                                            strokeWidth={isHovered ? 3 : 2}
                                            opacity={project.probability / 100}
                                            style={{ cursor: 'pointer' }}
                                            onMouseEnter={() => setHoveredProject(project.id)}
                                            onMouseLeave={() => setHoveredProject(null)}
                                            onClick={() => dispatch({ type: 'SET_MODAL', payload: project.id })}
                                        />
                                        {isHovered && (
                                            <g>
                                                <rect
                                                    x={pos.x + 12}
                                                    y={pos.y - 40}
                                                    width="180"
                                                    height="75"
                                                    fill="#1f2937"
                                                    rx="4"
                                                    opacity="0.95"
                                                />
                                                <text x={pos.x + 18} y={pos.y - 22}
                                                    fontSize="12" fontWeight="bold" fill="#fff">
                                                    {project.name}
                                                </text>
                                                <text x={pos.x + 18} y={pos.y - 8}
                                                    fontSize="11" fill="#d1d5db">
                                                    {xConfig.label}: {getAxisLabel(getAxisValue(project, xAxis), xAxis)}
                                                </text>
                                                <text x={pos.x + 18} y={pos.y + 6}
                                                    fontSize="11" fill="#d1d5db">
                                                    {yConfig.label}: {getAxisLabel(getAxisValue(project, yAxis), yAxis)}
                                                </text>
                                                <text x={pos.x + 18} y={pos.y + 20}
                                                    fontSize="11" fill="#d1d5db">
                                                    Stage: {project.stage}
                                                </text>
                                            </g>
                                        )}
                                    </g>
                                );
                            })}
                        </svg>

                        {/* Legend */}
                        <div className="mt-6 flex gap-6">
                            {Object.entries(stageColors).map(([stage, colors]) => (
                                <div key={stage} className="flex items-center gap-2">
                                    <div
                                        className="w-4 h-4 rounded-full"
                                        style={{ backgroundColor: colors.hex }}
                                    />
                                    <span className="text-sm">{stage}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // People Roster View Component
        const PeopleRosterView = () => {
            const { state, dispatch } = useContext(AppContext);
            const people = state.people || [];
            const projects = state.projects;

            const [roleFilter, setRoleFilter] = useState('All');
            const [sortKey, setSortKey] = useState('name');
            const [editingId, setEditingId] = useState(null); // null | 'new' | personId
            const [formData, setFormData] = useState({ name: '', role: 'Data Scientist', capacity: 1.0 });

            const ROLES = ['Data Scientist', 'Geoscientist', 'Project Manager'];

            // Current week for utilization display
            const currentWeek = useMemo(() => {
                const now = new Date();
                const start = new Date('2026-01-01');
                const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24 * 7)) + 1;
                return Math.max(1, Math.min(52, diff));
            }, []);

            // Compute current utilization per person
            const personUtils = useMemo(() => {
                const m = {};
                people.forEach(p => {
                    m[p.id] = getPersonWeekLoad(p.id, currentWeek, projects);
                });
                return m;
            }, [people, projects, currentWeek]);

            // Compute assigned projects per person
            const personProjects = useMemo(() => {
                const m = {};
                people.forEach(p => {
                    m[p.id] = projects.filter(proj =>
                        (proj.assignedPeople || []).some(a => a.personId === p.id)
                    );
                });
                return m;
            }, [people, projects]);

            // Staffing mismatch detection
            const mismatchedProjects = useMemo(() =>
                projects.filter(proj => {
                    if (!proj.startWeek) return false; // unscheduled — no warning
                    const checks = [
                        reconcileRole(proj, 'Data Scientist',  people, 'dataScientists'),
                        reconcileRole(proj, 'Geoscientist',    people, 'geoscientists'),
                        reconcileRole(proj, 'Project Manager', people, 'projectManagers'),
                    ];
                    return checks.some(c => c.assigned > 0 && c.assigned !== c.planned);
                }), [projects, people]);

            const filtered = useMemo(() => {
                let list = roleFilter === 'All' ? [...people] : people.filter(p => p.role === roleFilter);
                list.sort((a, b) => {
                    if (sortKey === 'name') return a.name.localeCompare(b.name);
                    if (sortKey === 'role') return a.role.localeCompare(b.role);
                    if (sortKey === 'utilization') {
                        const aU = personUtils[a.id] / a.capacity;
                        const bU = personUtils[b.id] / b.capacity;
                        return bU - aU;
                    }
                    return 0;
                });
                return list;
            }, [people, roleFilter, sortKey, personUtils]);

            const startEdit = (person) => {
                setEditingId(person.id);
                setFormData({ name: person.name, role: person.role, capacity: person.capacity });
            };

            const startAdd = () => {
                setEditingId('new');
                setFormData({ name: '', role: 'Data Scientist', capacity: 1.0 });
            };

            const saveEdit = () => {
                if (!formData.name.trim()) return;
                if (editingId === 'new') {
                    dispatch({ type: 'ADD_PERSON', payload: { ...formData, id: generateId() } });
                } else {
                    dispatch({ type: 'UPDATE_PERSON', payload: { id: editingId, updates: formData } });
                }
                setEditingId(null);
            };

            const removePerson = (id) => {
                if (confirm('Remove this person? Their assignments on projects will be orphaned.')) {
                    dispatch({ type: 'DELETE_PERSON', payload: id });
                }
            };

            const handleExportPeopleCSV = () => {
                const headers = ['name', 'role', 'capacity', 'assigned_projects'];
                const rows = people.map(person => {
                    const assignedProjs = projects.filter(proj =>
                        (proj.assignedPeople || []).some(a => a.personId === person.id)
                    ).map(p => p.name).join('|');
                    return [
                        person.name,
                        person.role,
                        person.capacity,
                        assignedProjs
                    ];
                });

                const csvContent = [
                    headers.map(h => `"${h}"`).join(','),
                    ...rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
                ].join('\n');

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `people-roster-${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
                URL.revokeObjectURL(url);
            };

            const handleImportPeopleCSV = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.csv';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            try {
                                const csv = event.target.result;
                                const lines = csv.split('\n').filter(line => line.trim());

                                if (lines.length < 2) {
                                    alert('People CSV file is empty or invalid');
                                    return;
                                }

                                // Parse header
                                const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim().toLowerCase());
                                const requiredCols = ['name', 'role', 'capacity', 'assigned_projects'];
                                const missingCols = requiredCols.filter(c => !headers.includes(c));
                                if (missingCols.length > 0) {
                                    alert('Missing required columns: ' + missingCols.join(', ') + '\n\nExpected columns: ' + requiredCols.join(', '));
                                    return;
                                }

                                const colIdx = Object.fromEntries(requiredCols.map(c => [c, headers.indexOf(c)]));

                                const errors = [];
                                const warnings = [];
                                const newPeople = [];
                                const existingProjectNames = new Set(projects.map(p => p.name));

                                for (let i = 1; i < lines.length; i++) {
                                    // Parse CSV fields handling quoted values
                                    const values = [];
                                    let current = '';
                                    let inQuotes = false;
                                    for (let char of lines[i]) {
                                        if (char === '"') {
                                            inQuotes = !inQuotes;
                                        } else if (char === ',' && !inQuotes) {
                                            values.push(current.trim());
                                            current = '';
                                        } else {
                                            current += char;
                                        }
                                    }
                                    values.push(current.trim());

                                    const name = values[colIdx.name]?.trim();
                                    if (!name) {
                                        errors.push(`Row ${i + 1}: Missing name, skipped`);
                                        continue;
                                    }

                                    const role = values[colIdx.role]?.trim() || '';
                                    const VALID_ROLES = ['Data Scientist', 'Geoscientist', 'Project Manager'];
                                    if (!VALID_ROLES.includes(role)) {
                                        errors.push(`Row ${i + 1} ("${name}"): Invalid role "${role}". Must be one of: ${VALID_ROLES.join(', ')}`);
                                        continue;
                                    }

                                    let capacityStr = values[colIdx.capacity]?.trim() || '';
                                    let capacity;
                                    if (capacityStr.endsWith('%')) {
                                        capacity = parseFloat(capacityStr) / 100;
                                    } else {
                                        capacity = parseFloat(capacityStr);
                                    }
                                    if (isNaN(capacity) || capacity < 0 || capacity > 1) {
                                        errors.push(`Row ${i + 1} ("${name}"): Invalid capacity "${capacityStr}". Must be 0-1 (decimal) or 0%-100%`);
                                        continue;
                                    }

                                    const assignedStr = values[colIdx.assigned_projects]?.trim() || '';
                                    const assignedProjectNames = assignedStr ? assignedStr.split('|').map(s => s.trim()).filter(Boolean) : [];

                                    // Warn about unrecognized project names
                                    assignedProjectNames.forEach(pName => {
                                        if (!existingProjectNames.has(pName)) {
                                            warnings.push(`Row ${i + 1} ("${name}"): Project "${pName}" not found in current project list`);
                                        }
                                    });

                                    newPeople.push({ name, role, capacity, id: generateId(), _assignedProjectNames: assignedProjectNames });
                                }

                                if (errors.length > 0 && newPeople.length === 0) {
                                    alert('Import failed. All rows had errors:\n\n' + errors.join('\n'));
                                    return;
                                }

                                let confirmMsg = `Import ${newPeople.length} people from CSV? This will replace all current people.`;
                                if (errors.length > 0) {
                                    confirmMsg += `\n\nErrors (${errors.length} rows skipped):\n` + errors.join('\n');
                                }
                                if (warnings.length > 0) {
                                    confirmMsg += `\n\nWarnings:\n` + warnings.join('\n');
                                }

                                if (confirm(confirmMsg)) {
                                    // Build clean people and project assignments map
                                    const projectAssignments = {};
                                    const cleanPeople = newPeople.map(person => {
                                        const { _assignedProjectNames, ...personData } = person;
                                        projectAssignments[person.id] = _assignedProjectNames;
                                        return personData;
                                    });

                                    dispatch({
                                        type: 'IMPORT_PEOPLE',
                                        payload: { people: cleanPeople, projectAssignments }
                                    });
                                }
                            } catch (error) {
                                alert('Error importing People CSV: ' + error.message);
                            }
                        };
                        reader.readAsText(file);
                    }
                };
                input.click();
            };

            const SortHeader = ({ label, k }) => (
                <th
                    className="px-4 py-2 text-left cursor-pointer hover:bg-gray-100 whitespace-nowrap"
                    onClick={() => setSortKey(k)}
                >
                    {label} {sortKey === k ? '↓' : ''}
                </th>
            );

            return (
                <div>
                    {/* Mismatch banner */}
                    {mismatchedProjects.length > 0 && (
                        <div className="mb-4 flex items-center gap-3 px-4 py-2 bg-amber-50 border border-amber-300 rounded-md text-sm text-amber-800">
                            <span>⚠ {mismatchedProjects.length} scheduled project{mismatchedProjects.length > 1 ? 's' : ''} have staffing gaps.</span>
                            <button
                                className="underline text-amber-700"
                                onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'list' })}
                            >
                                Review in Project List →
                            </button>
                        </div>
                    )}

                    {/* Role filter + Sort + Add */}
                    <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
                        <div className="flex gap-2">
                            {['All', ...ROLES].map(r => (
                                <button
                                    key={r}
                                    onClick={() => setRoleFilter(r)}
                                    className={`px-3 py-1 rounded-full text-sm border transition-colors ${roleFilter === r ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'}`}
                                >
                                    {r}
                                </button>
                            ))}
                        </div>
                        <div className="flex items-center gap-2">
                            <button
                                onClick={startAdd}
                                className="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm"
                            >
                                + Add Person
                            </button>
                            <div className="border-l border-gray-300 h-8 mx-1"></div>
                            <button
                                onClick={handleImportPeopleCSV}
                                className="px-3 py-2 bg-teal-600 text-white rounded-md hover:bg-teal-700 text-sm"
                            >
                                Import People CSV
                            </button>
                            <button
                                onClick={handleExportPeopleCSV}
                                className="px-3 py-2 bg-teal-600 text-white rounded-md hover:bg-teal-700 text-sm"
                            >
                                Export People CSV
                            </button>
                        </div>
                    </div>

                    {/* Add new person inline form */}
                    {editingId === 'new' && (
                        <div className="mb-4 p-4 border border-blue-200 bg-blue-50 rounded-md flex items-end gap-4 flex-wrap">
                            <div>
                                <label className="block text-xs font-medium text-gray-600 mb-1">Name *</label>
                                <input
                                    autoFocus
                                    className="px-3 py-2 border border-gray-300 rounded-md text-sm w-44"
                                    value={formData.name}
                                    onChange={e => setFormData({ ...formData, name: e.target.value })}
                                    placeholder="Full name"
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-gray-600 mb-1">Role</label>
                                <select
                                    className="px-3 py-2 border border-gray-300 rounded-md text-sm"
                                    value={formData.role}
                                    onChange={e => setFormData({ ...formData, role: e.target.value })}
                                >
                                    {ROLES.map(r => <option key={r}>{r}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-gray-600 mb-1">Capacity</label>
                                <select
                                    className="px-3 py-2 border border-gray-300 rounded-md text-sm"
                                    value={formData.capacity}
                                    onChange={e => setFormData({ ...formData, capacity: parseFloat(e.target.value) })}
                                >
                                    {FRACTION_OPTIONS.map(f => <option key={f} value={f}>{f.toFixed(2)}</option>)}
                                </select>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={saveEdit} className="px-3 py-2 bg-blue-600 text-white rounded-md text-sm hover:bg-blue-700">Save</button>
                                <button onClick={() => setEditingId(null)} className="px-3 py-2 border border-gray-300 rounded-md text-sm hover:bg-gray-50">Cancel</button>
                            </div>
                        </div>
                    )}

                    {/* Roster table */}
                    <div className="table-container">
                        <table className="w-full border-collapse text-sm">
                            <thead className="sticky-header bg-gray-100">
                                <tr>
                                    <SortHeader label="Name" k="name" />
                                    <SortHeader label="Role" k="role" />
                                    <th className="px-4 py-2 text-left">Capacity</th>
                                    <th className="px-4 py-2 text-left">Assigned Projects</th>
                                    <SortHeader label={`Utilization (Wk ${currentWeek})`} k="utilization" />
                                    <th className="px-4 py-2 text-left">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filtered.length === 0 && (
                                    <tr>
                                        <td colSpan="6" className="px-4 py-8 text-center text-gray-400">
                                            {people.length === 0 ? 'No team members yet. Click "+ Add Person" to get started.' : 'No matches for current filter.'}
                                        </td>
                                    </tr>
                                )}
                                {filtered.map(person => {
                                    const load = personUtils[person.id] || 0;
                                    const pct = Math.round((load / person.capacity) * 100);
                                    const over = load > person.capacity;
                                    const isEditing = editingId === person.id;
                                    const assignedProjs = personProjects[person.id] || [];

                                    if (isEditing) {
                                        return (
                                            <tr key={person.id} className="bg-blue-50 border-b">
                                                <td className="px-4 py-2">
                                                    <input
                                                        autoFocus
                                                        className="px-2 py-1 border border-gray-300 rounded w-36 text-sm"
                                                        value={formData.name}
                                                        onChange={e => setFormData({ ...formData, name: e.target.value })}
                                                    />
                                                </td>
                                                <td className="px-4 py-2">
                                                    <select
                                                        className="px-2 py-1 border border-gray-300 rounded text-sm"
                                                        value={formData.role}
                                                        onChange={e => setFormData({ ...formData, role: e.target.value })}
                                                    >
                                                        {ROLES.map(r => <option key={r}>{r}</option>)}
                                                    </select>
                                                </td>
                                                <td className="px-4 py-2">
                                                    <select
                                                        className="px-2 py-1 border border-gray-300 rounded text-sm"
                                                        value={formData.capacity}
                                                        onChange={e => setFormData({ ...formData, capacity: parseFloat(e.target.value) })}
                                                    >
                                                        {FRACTION_OPTIONS.map(f => <option key={f} value={f}>{f.toFixed(2)}</option>)}
                                                    </select>
                                                </td>
                                                <td colSpan="2" />
                                                <td className="px-4 py-2">
                                                    <div className="flex gap-2">
                                                        <button onClick={saveEdit} className="px-2 py-1 bg-blue-600 text-white rounded text-xs hover:bg-blue-700">Save</button>
                                                        <button onClick={() => setEditingId(null)} className="px-2 py-1 border border-gray-300 rounded text-xs hover:bg-gray-50">Cancel</button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    }

                                    return (
                                        <tr key={person.id} className="border-b hover:bg-gray-50">
                                            <td className="px-4 py-2 font-medium">{person.name}</td>
                                            <td className="px-4 py-2 text-gray-600">{person.role}</td>
                                            <td className="px-4 py-2">{person.capacity.toFixed(2)}</td>
                                            <td className="px-4 py-2 text-gray-600">
                                                {assignedProjs.length === 0
                                                    ? <span className="text-gray-400">—</span>
                                                    : assignedProjs.map(p => (
                                                        <button
                                                            key={p.id}
                                                            onClick={() => dispatch({ type: 'SET_MODAL', payload: p.id })}
                                                            className="mr-1 mb-1 px-1.5 py-0.5 text-xs rounded bg-gray-100 hover:bg-gray-200 text-gray-700"
                                                        >
                                                            {p.name}
                                                        </button>
                                                    ))
                                                }
                                            </td>
                                            <td className="px-4 py-2">
                                                {load === 0
                                                    ? <span className="text-gray-400">—</span>
                                                    : <span className={`font-medium ${over ? 'text-red-600' : pct >= 90 ? 'text-amber-600' : 'text-green-700'}`}>
                                                        {load.toFixed(2)} / {person.capacity.toFixed(2)} ({pct}%) {over ? '⚠' : ''}
                                                    </span>
                                                }
                                            </td>
                                            <td className="px-4 py-2">
                                                <div className="flex gap-3">
                                                    <button onClick={() => startEdit(person)} className="text-blue-600 hover:text-blue-800 text-xs">Edit</button>
                                                    <button onClick={() => removePerson(person.id)} className="text-red-600 hover:text-red-800 text-xs">Remove</button>
                                                </div>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                    <div className="mt-3 text-xs text-gray-500">
                        {filtered.length} of {people.length} people shown
                    </div>
                </div>
            );
        };

        // Header Component
        const Header = () => {
            const { state, dispatch } = useContext(AppContext);
            const [showSettings, setShowSettings] = useState(false);

            const handleExport = () => {
                const dataStr = JSON.stringify(state, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `project-schedule-${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                URL.revokeObjectURL(url);
            };

            const handleImport = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            try {
                                const imported = JSON.parse(event.target.result);
                                if (confirm('Replace all data with imported data?')) {
                                    dispatch({ type: 'LOAD_STATE', payload: imported });
                                }
                            } catch (error) {
                                alert('Error importing file: ' + error.message);
                            }
                        };
                        reader.readAsText(file);
                    }
                };
                input.click();
            };

            const handleExportCSV = () => {
                // CSV Headers
                const headers = [
                    'Name', 'Sponsor', 'Description', 'OKR', 'Source', 'Stage',
                    'Probability', 'Impact', 'Effort', 'Duration (weeks)',
                    'Data Scientists', 'Geoscientists', 'Project Managers', 'Start Week'
                ];

                // Convert projects to CSV rows
                const rows = state.projects.map(p => [
                    p.name || '',
                    p.sponsor || '',
                    (p.description || '').replace(/"/g, '""'), // Escape quotes
                    p.okr || '',
                    p.source || '',
                    p.stage || '',
                    p.probability || '',
                    p.impact || '',
                    p.effort || '',
                    p.durationWeeks || '',
                    p.resources?.dataScientists || 0,
                    p.resources?.geoscientists || 0,
                    p.resources?.projectManagers || 0,
                    p.startWeek || ''
                ]);

                // Combine headers and rows
                const csvContent = [
                    headers.map(h => `"${h}"`).join(','),
                    ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
                ].join('\n');

                // Download CSV
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `project-schedule-${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
                URL.revokeObjectURL(url);
            };

            const handleImportCSV = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.csv';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            try {
                                const csv = event.target.result;
                                const lines = csv.split('\n').filter(line => line.trim());

                                if (lines.length < 2) {
                                    alert('CSV file is empty or invalid');
                                    return;
                                }

                                // Parse header
                                const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim());

                                // Parse rows
                                const projects = [];
                                for (let i = 1; i < lines.length; i++) {
                                    const values = [];
                                    let current = '';
                                    let inQuotes = false;

                                    // Simple CSV parser handling quoted fields
                                    for (let char of lines[i]) {
                                        if (char === '"') {
                                            inQuotes = !inQuotes;
                                        } else if (char === ',' && !inQuotes) {
                                            values.push(current.trim());
                                            current = '';
                                        } else {
                                            current += char;
                                        }
                                    }
                                    values.push(current.trim());

                                    if (values.length >= 14 && values[0]) { // Must have name at minimum
                                        const project = {
                                            id: generateId(),
                                            name: values[0],
                                            sponsor: values[1] || '',
                                            description: values[2] || '',
                                            okr: values[3] || 'Revenue',
                                            source: values[4] || 'External',
                                            stage: values[5] || 'Frontier',
                                            probability: parseFloat(values[6]) || state.settings.defaultProbabilities.frontier,
                                            impact: values[7] || 'Medium',
                                            effort: values[8] || 'M',
                                            durationWeeks: parseInt(values[9]) || 4,
                                            resources: {
                                                dataScientists: parseFloat(values[10]) || 0,
                                                geoscientists: parseFloat(values[11]) || 0,
                                                projectManagers: parseFloat(values[12]) || 0
                                            },
                                            startWeek: values[13] ? parseInt(values[13]) : null,
                                            dependencies: [],
                                            observations: { positive: [], negative: [] },
                                            probabilityHistory: [],
                                            createdAt: new Date().toISOString(),
                                            updatedAt: new Date().toISOString()
                                        };
                                        projects.push(project);
                                    }
                                }

                                if (projects.length === 0) {
                                    alert('No valid projects found in CSV');
                                    return;
                                }

                                if (confirm(`Import ${projects.length} projects from CSV? This will replace all current projects.`)) {
                                    dispatch({
                                        type: 'LOAD_STATE',
                                        payload: {
                                            ...state,
                                            projects: projects
                                        }
                                    });
                                }
                            } catch (error) {
                                alert('Error importing CSV: ' + error.message);
                            }
                        };
                        reader.readAsText(file);
                    }
                };
                input.click();
            };

            const handleLoadSample = () => {
                if (confirm('Load sample data? This will add sample projects.')) {
                    dispatch({ type: 'LOAD_SAMPLE_DATA' });
                }
            };

            return (
                <div className="bg-white border-b shadow-sm">
                    <div className="container mx-auto px-6 py-4">
                        <div className="flex items-center justify-between mb-4">
                            <div>
                                <h1 className="text-3xl font-bold">Project Scheduling Toolkit</h1>
                                <div className="text-sm text-gray-600 mt-1">Planning Calendar: 2026 (Jan 1 - Dec 31)</div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button
                                    onClick={() => dispatch({ type: 'SET_MODAL', payload: 'add' })}
                                    className="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700"
                                >
                                    + Add Project
                                </button>
                                <button
                                    onClick={handleLoadSample}
                                    className="px-3 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700 text-sm"
                                >
                                    Sample Data
                                </button>
                                <div className="border-l border-gray-300 h-8 mx-1"></div>
                                <button
                                    onClick={handleImportCSV}
                                    className="px-3 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 text-sm"
                                >
                                    📥 Import CSV
                                </button>
                                <button
                                    onClick={handleExportCSV}
                                    className="px-3 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 text-sm"
                                >
                                    📤 Export CSV
                                </button>
                                <div className="border-l border-gray-300 h-8 mx-1"></div>
                                <button
                                    onClick={handleImport}
                                    className="px-3 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 text-sm"
                                >
                                    Import JSON
                                </button>
                                <button
                                    onClick={handleExport}
                                    className="px-3 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 text-sm"
                                >
                                    Export JSON
                                </button>
                                <div className="border-l border-gray-300 h-8 mx-1"></div>
                                <button
                                    onClick={() => setShowSettings(true)}
                                    className="px-3 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 text-sm"
                                >
                                    ⚙️ Settings
                                </button>
                            </div>
                        </div>
                        <div className="flex items-center justify-between">
                            <CapacityIndicator />
                        </div>
                    </div>
                    {showSettings && <SettingsModal onClose={() => setShowSettings(false)} />}
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [state, dispatch] = useReducer(appReducer, initialState);

            useEffect(() => {
                const saved = localStorage.getItem('projectSchedulerState');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (confirm('Restore previous session?')) {
                            dispatch({ type: 'LOAD_STATE', payload: parsed });
                        }
                    } catch (e) {
                        console.error('Failed to restore state:', e);
                    }
                }
            }, []);

            useEffect(() => {
                const interval = setInterval(() => {
                    localStorage.setItem('projectSchedulerState', JSON.stringify(state));
                }, 30000);
                return () => clearInterval(interval);
            }, [state]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        dispatch({ type: 'SET_MODAL', payload: null });
                    } else if (e.key === 'n' && !e.target.matches('input, textarea')) {
                        dispatch({ type: 'SET_MODAL', payload: 'add' });
                    } else if (e.key >= '1' && e.key <= '6' && !e.target.matches('input, textarea')) {
                        const tabs = ['list', 'timeline', 'resource', 'forecast', 'crossplot', 'people'];
                        dispatch({ type: 'SET_ACTIVE_TAB', payload: tabs[parseInt(e.key) - 1] });
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            return (
                <AppContext.Provider value={{ state, dispatch }}>
                    <div className="min-h-screen bg-gray-50">
                        <Header />

                        <div className="container mx-auto px-6 py-6">
                            <div className="mb-6 flex border-b">
                                <button
                                    onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'list' })}
                                    className={`px-6 py-3 font-medium ${state.ui.activeTab === 'list' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600'}`}
                                >
                                    Project List
                                </button>
                                <button
                                    onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'timeline' })}
                                    className={`px-6 py-3 font-medium ${state.ui.activeTab === 'timeline' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600'}`}
                                >
                                    Timeline
                                </button>
                                <button
                                    onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'resource' })}
                                    className={`px-6 py-3 font-medium ${state.ui.activeTab === 'resource' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600'}`}
                                >
                                    Resource Allocation
                                </button>
                                <button
                                    onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'forecast' })}
                                    className={`px-6 py-3 font-medium ${state.ui.activeTab === 'forecast' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600'}`}
                                >
                                    Forecast
                                </button>
                                <button
                                    onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'crossplot' })}
                                    className={`px-6 py-3 font-medium ${state.ui.activeTab === 'crossplot' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600'}`}
                                >
                                    Cross-Plot Analysis
                                </button>
                                <button
                                    onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'people' })}
                                    className={`px-6 py-3 font-medium ${state.ui.activeTab === 'people' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600'}`}
                                >
                                    People
                                </button>
                            </div>

                            <div className="bg-white rounded-lg shadow p-6">
                                {state.ui.activeTab === 'list' && <ProjectListView />}
                                {state.ui.activeTab === 'timeline' && <TimelineView />}
                                {state.ui.activeTab === 'resource' && <ResourceAllocationView />}
                                {state.ui.activeTab === 'forecast' && <ForecastView />}
                                {state.ui.activeTab === 'crossplot' && <CrossPlotView />}
                                {state.ui.activeTab === 'people' && <PeopleRosterView />}
                            </div>
                        </div>

                        {state.ui.modalOpen === 'add' && <AddProjectModal onClose={() => dispatch({ type: 'SET_MODAL', payload: null })} />}
                        {state.ui.modalOpen && state.ui.modalOpen !== 'add' && (
                            <ProjectDetailModal
                                projectId={state.ui.modalOpen}
                                onClose={() => dispatch({ type: 'SET_MODAL', payload: null })}
                            />
                        )}
                    </div>
                </AppContext.Provider>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
